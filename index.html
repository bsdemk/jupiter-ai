<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JUPITER | Justified Universal Processing Intelligence</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap');
    
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #0a0a2a 0%, #000000 100%);
      color: #00ddff;
      font-family: 'Orbitron', sans-serif;
      overflow: hidden;
      height: 100vh;
    }
    
    .hud {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border: 2px solid rgba(0, 221, 255, 0.3);
      box-shadow: 0 0 60px rgba(0, 221, 255, 0.5);
    }
    
    .header {
      text-align: center;
      padding: 20px;
      border-bottom: 1px solid rgba(255, 215, 0, 0.4);
    }
    
    .logo {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: 8px;
      text-shadow: 0 0 20px #ffd700;
      color: #ffd700;
    }
    
    .subtitle {
      font-size: 1.1rem;
      opacity: 0.8;
      margin-top: -10px;
    }
    
    .main {
      display: flex;
      height: calc(100vh - 180px);
      padding: 20px;
      gap: 20px;
    }
    
    .interface {
      flex: 2;
      background: rgba(10, 20, 50, 0.7);
      border: 1px solid #00ddff;
      border-radius: 15px;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    
    .chat {
      height: 70%;
      overflow-y: auto;
      padding: 15px;
      background: rgba(0,0,0,0.4);
      border-radius: 10px;
      margin-bottom: 15px;
    }
    
    .message {
      margin: 12px 0;
      padding: 10px 15px;
      border-radius: 10px;
      max-width: 80%;
    }
    
    .jupiter-msg {
      background: rgba(0, 221, 255, 0.1);
      border-left: 4px solid #00ddff;
      align-self: flex-start;
    }
    
    .input-area {
      display: flex;
      gap: 10px;
    }
    
    input {
      flex: 1;
      background: rgba(0,0,0,0.6);
      border: 1px solid #00ddff;
      color: #00ffcc;
      padding: 15px;
      border-radius: 50px;
      font-family: 'Orbitron', sans-serif;
    }
    
    button {
      background: #ffd700;
      color: #000;
      border: none;
      padding: 0 30px;
      border-radius: 50px;
      font-weight: bold;
      cursor: pointer;
    }
    
    .status {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      padding: 10px 20px;
      border-radius: 10px;
      border: 1px solid #00ff88;
      font-size: 0.9rem;
    }
    
    .scanline {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(transparent, rgba(0, 221, 255, 0.05), transparent);
      animation: scan 4s linear infinite;
      pointer-events: none;
    }
    
    @keyframes scan {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="header">
      <div class="logo">JUPITER</div>
      <div class="subtitle">Justified Universal Processing Intelligence</div>
    </div>
    
    <div class="main">
      <div class="interface">
        <div class="status">● ONLINE • SYSTEME NOMINAL • v1.0</div>
        
        <div class="chat" id="chat">
          <div class="message jupiter-msg">
            <strong>JUPITER:</strong> Guten Tag, Sir. Ich bin vollständig aktiviert.<br>
            Wie kann ich Ihnen heute dienen?
          </div>
        </div>
        
        <div class="input-area">
          <input type="text" id="userInput" placeholder="Nachricht an JUPITER eingeben..." onkeypress="if(event.key === 'Enter') sendMessage()">
          <button onclick="sendMessage()">SENDEN</button>
        </div>
        
        <div class="scanline"></div>
      </div>
    </div>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById('userInput');
      const chat = document.getElementById('chat');
      const text = input.value.trim();
      
      if (!text) return;
      
      // User Nachricht
      const userMsg = document.createElement('div');
      userMsg.className = 'message';
      userMsg.style.background = 'rgba(255, 215, 0, 0.1)';
      userMsg.style.borderLeft = '4px solid #ffd700';
      userMsg.style.marginLeft = 'auto';
      userMsg.innerHTML = `<strong>Sie:</strong> ${text}`;
      chat.appendChild(userMsg);
      
      input.value = '';
      chat.scrollTop = chat.scrollHeight;
      
      // Jupiter Antwort (simuliert)
      setTimeout(() => {
        const responses = [
          "Verstanden, Sir. Ich kümmere mich darum.",
          "Analyse läuft... Interessante Anfrage.",
          "Mit Freude, Sir.",
          "Bereits erledigt. Brauchen Sie noch weitere Unterstützung?",
          "Die Sterne sind heute günstig für Ihr Vorhaben."
        ];
        
        const randomResponse = responses[Math.floor(Math.random() * responses.length)];
        
        const jMsg = document.createElement('div');
        jMsg.className = 'message jupiter-msg';
        jMsg.innerHTML = `<strong>JUPITER:</strong> ${randomResponse}`;
        chat.appendChild(jMsg);
        chat.scrollTop = chat.scrollHeight;
      }, 800);
    }
    
    // Begrüßung beim Laden
    window.onload = () => {
      console.log("%cJUPITER aktiviert", "color: #00ddff; font-size: 20px; font-family: Orbitron");
    };
  </script>
</body>
</html>
